<!DOCTYPE html>

<html lang="th"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Analysis - Scoring System</title>
    <link href="./AI Face Analysis - Scoring System_files/css2" rel="stylesheet">
    <script defer="" src="./AI Face Analysis - Scoring System_files/face-api.js.download"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #f43f5e;
            --bg-dark: #0f172a;
        }

        body { 
            font-family: 'Kanit', sans-serif; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
        }

        .container { 
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px; 
            border-radius: 32px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .view-section { text-align: center; }
        
        h2 { font-size: 1.8rem; margin: 0 0 15px 0; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        #video-container { 
            position: relative; 
            border-radius: 20px; 
            overflow: hidden; 
            background: #000; 
            aspect-ratio: 4/3;
            border: 2px solid rgba(255,255,255,0.1);
        }

        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        /* Score Circle */
        .score-box {
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .circle-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 15px;
        }

        .score-value {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: 600;
            color: var(--secondary);
        }

        .btn { 
            width: 100%;
            padding: 14px; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white; 
            border: none; 
            border-radius: 16px; 
            cursor: pointer; 
            font-weight: 600;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn:disabled { background: #334155; opacity: 0.5; }

        .result-item {
            width: 100%;
            background: rgba(255,255,255,0.05);
            margin: 8px 0;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .label { color: #94a3b8; }
        .val { color: #fff; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="view-section">
        <h2>📸 Face Analysis AI</h2>
        <div id="video-container">
            <video id="webcam" autoplay="" playsinline="" muted=""></video>
            <canvas id="overlay" width="640" height="480"></canvas>
        </div>
        <button id="capture-btn" class="btn" style="display: none;">✨ วิเคราะห์และให้คะแนน</button>
        <button id="reset-btn" class="btn" style="background: rgb(51, 65, 85); display: block;">🔄 วัดใหม่</button>
    </div>

    <div class="score-section">
        <div class="score-box">
            <b>คะแนนใบหน้าของคุณ</b>
            <div class="circle-wrap">
                <div class="score-value" id="final-score">88</div>
                <svg width="120" height="120">
                    <circle cx="60" cy="60" r="54" stroke="rgba(255,255,255,0.1)" stroke-width="8" fill="none"></circle>
                    <circle id="progress" cx="60" cy="60" r="54" stroke="url(#grad)" stroke-width="8" fill="none" stroke-dasharray="339.29" stroke-dashoffset="339.29" stroke-linecap="round" style="transition: 1.5s ease-out; stroke-dashoffset: 40.7148;"></circle>
                    <defs>
                        <lineargradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#6366f1"></stop>
                            <stop offset="100%" style="stop-color:#a855f7"></stop>
                        </lineargradient>
                    </defs>
                </svg>
            </div>
            <div id="score-text" style="color: #94a3b8; font-size: 0.8rem;">วิเคราะห์สำเร็จ!</div>
        </div>

        <div id="details" style="margin-top: 20px;">
            <div class="result-item"><span class="label">👁️ ตา:</span> <span class="val" id="res-eyes">ตากลมโต</span></div>
            <div class="result-item"><span class="label">👃 จมูก:</span> <span class="val" id="res-nose">ทรงกว้าง</span></div>
            <div class="result-item"><span class="label">👄 ปาก:</span> <span class="val" id="res-mouth">ปากอิ่ม</span></div>
            <div class="result-item"><span class="label">⚖️ ความสมมาตร:</span> <span class="val" id="res-sym">90%</span></div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('capture-btn');
    const resetBtn = document.getElementById('reset-btn');
    const progressCircle = document.getElementById('progress');
    const scoreVal = document.getElementById('final-score');

    async function init() {
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        btn.disabled = false;
        document.getElementById('score-text').innerText = "AI พร้อมแล้ว!";
    }

    async function startVideo() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        init();
    }

    btn.onclick = async () => {
        const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
        if (!detection) return alert("หาหน้าไม่เจอครับ!");

        video.pause();
        btn.style.display = 'none';
        resetBtn.style.display = 'block';

        const dims = faceapi.matchDimensions(canvas, video, true);
        const resized = faceapi.resizeResults(detection, dims);
        
        // วาดจุด
        ctx.fillStyle = "#6366f1";
        resized.landmarks.positions.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 2*Math.PI); ctx.fill(); });

        calculateScores(resized.landmarks);
    };

    function calculateScores(landmarks) {
        const eyeL = landmarks.getLeftEye();
        const eyeR = landmarks.getRightEye();
        const nose = landmarks.getNose();
        const mouth = landmarks.getMouth();

        // 1. คำนวณความสมมาตร (Symmetry) - วัดระยะห่างจากแกนกลางจมูก
        const center = nose[0].x;
        const leftDist = center - eyeL[0].x;
        const rightDist = eyeR[3].x - center;
        const symmetry = Math.min(leftDist, rightDist) / Math.max(leftDist, rightDist);
        
        // 2. ให้คะแนน (Logic จำลองสัดส่วน)
        let baseScore = 70 + (symmetry * 20) + (Math.random() * 10);
        if (baseScore > 99) baseScore = 99;

        // แสดงผล
        updateScoreCircle(Math.floor(baseScore));
        document.getElementById('res-eyes').innerText = (eyeL[3].x - eyeL[0].x) > 20 ? "ตากลมโต" : "ตาเรียว";
        document.getElementById('res-nose').innerText = (nose[8].x - nose[4].x) > 30 ? "ทรงกว้าง" : "ทรงเรียว";
        document.getElementById('res-mouth').innerText = (mouth[6].x - mouth[0].x) > 50 ? "ปากอิ่ม" : "ปากเรียว";
        document.getElementById('res-sym').innerText = (symmetry * 100).toFixed(0) + "%";
        document.getElementById('score-text').innerText = "วิเคราะห์สำเร็จ!";
    }

    function updateScoreCircle(score) {
        const full = 339.29;
        const offset = full - (score / 100 * full);
        progressCircle.style.strokeDashoffset = offset;
        
        let current = 0;
        const timer = setInterval(() => {
            if (current >= score) clearInterval(timer);
            scoreVal.innerText = current;
            current++;
        }, 20);
    }

    resetBtn.onclick = () => { location.reload(); };

    startVideo();
</script>

</body></html>
